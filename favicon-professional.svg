<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <!-- Gradient background -->
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="256" height="256" fill="url(#grad)"/>
  
  <!-- Professional message icon -->
  <g transform="translate(60, 60)">
    <!-- Outer envelope -->
    <rect x="0" y="20" width="136" height="96" rx="8" fill="none" stroke="white" stroke-width="8"/>
    
    <!-- Diagonal line (envelope flap) -->
    <line x1="0" y1="20" x2="68" y2="68" stroke="white" stroke-width="8"/>
    <line x1="136" y1="20" x2="68" y2="68" stroke="white" stroke-width="8"/>
  </g>
</svg>
